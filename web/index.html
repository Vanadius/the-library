<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PALIMPSEST</title>
  <meta name="description" content="A library of almost-meaning. Read your way out." />
  <link rel="stylesheet" href="css/style.css?v=202606051555" />
</head>
<body>
  <div id="app">
    <div id="status"></div>
    <div id="reader"></div>
    <div id="footer">
      <button id="btn-journal" title="mark this room (J)">journal</button>
      <button id="btn-sound" title="toggle sound">sound: off</button>
      <span class="spacer"></span>
      <span class="hint">1–9 / ↑↓ + enter to walk</span>
    </div>
  </div>

  <!-- journal overlay -->
  <div id="journal">
    <h2>what you wrote down</h2>
    <div id="journal-entries" class="entries"></div>
    <textarea id="journal-text" placeholder="mark where you are, while the ink still holds…"></textarea>
    <div class="jbtns">
      <button onclick="P.app.saveNote()">mark</button>
      <button onclick="P.app.closeJournal()">close</button>
    </div>
  </div>

  <!-- title / intro / endings -->
  <div id="screen"></div>

  <!-- world data, then runtime (classic scripts so it runs from file://).
       The ?v= cache-busting tags are bumped on each release so a new GitHub
       Pages deploy invalidates the previously-cached JS/CSS automatically. -->
  <script src="data/graph.js?v=202606051555"></script>
  <script src="js/core.js?v=202606051555"></script>
  <script src="js/persist.js?v=202606051555"></script>
  <script src="js/degrade.js?v=202606051555"></script>
  <script src="js/ghosts.js?v=202606051555"></script>
  <script src="js/audio.js?v=202606051555"></script>
  <script src="js/engine.js?v=202606051555"></script>
  <script src="js/render.js?v=202606051555"></script>
  <script src="js/main.js?v=202606051555"></script>
</body>
</html>
