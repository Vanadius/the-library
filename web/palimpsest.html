<style>
/* PALIMPSEST — terminal aesthetic.
 *
 * Amber phosphor on near-black. The chrome (HUD, choices, notes) is what
 * degrades; the passage you read stays clean. Degradation is driven entirely by
 * CSS custom properties set from JS: --coh (0..1 local coherence) and --drift.
 * Nothing here corrupts game state — it only corrupts the screen.
 */

:root {
  --amber: #ffb000;
  --amber-dim: #b97f06;
  --amber-faint: #6b4d08;
  --bg: #0a0805;
  --bg2: #080604;
  --paper: #efe3c2;
  --coh: 1;        /* local coherence, 0..1 */
  --drift: 0;      /* degradation amount, 0..1 */
  --flicker: 0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  color: var(--amber);
  font-family: "DejaVu Sans Mono", "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 17px;
  line-height: 1.7;
  overflow: hidden;
}

/* CRT vignette + scanlines, intensifying as coherence falls. */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background:
    radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.5) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,calc(0.05 + 0.09*(1 - var(--coh)))) 3px);
  mix-blend-mode: multiply;
}
body::after { /* drift haze: a cold film that thickens in the deep */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 49;
  background: radial-gradient(ellipse at 50% 60%, rgba(40,60,90,calc(0.16*var(--drift))) 0%, transparent 60%);
  opacity: var(--drift);
  transition: opacity 1.2s ease;
}

#app { height: 100%; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; padding: 0 28px; }

/* ---- status line ---- */
#status {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--amber-faint); padding: 16px 2px 10px; border-bottom: 1px solid rgba(107,77,8,0.25);
  min-height: 44px;
}
#status .loc { color: var(--amber-dim); }
#status .loc .depth { color: var(--amber); letter-spacing: 0.16em; }
#status .loc .locname { color: var(--amber-dim); }
#status .right { text-align: right; }

/* ---- reading area ---- */
#reader { flex: 1; overflow-y: auto; padding: 30px 4px 10px; scrollbar-width: thin; scrollbar-color: var(--amber-faint) transparent; }
#reader::-webkit-scrollbar { width: 8px; }
#reader::-webkit-scrollbar-thumb { background: var(--amber-faint); }

.passage {
  /* The room you read stays legible, ALWAYS. Incoherence lives in the words
   * (Markov), never in the rendering — that's the design's one inviolable rule.
   * Only a faint, fixed phosphor glow; it does not scale with coherence. */
  color: var(--paper);
  white-space: pre-wrap;
  text-shadow: 0 0 1px rgba(255,176,0,0.10);
  animation: settle 0.5s ease;
}
.passage.authored { /* the exit reads warmer, steadier — but we never label it */
  color: #fff4dd;
}
@keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* A worn page: the generated surface thins, and the older book shows beneath.
   The surface stays legible (the One Rule) — it only fades a little. */
.passage.worn { opacity: 0.72; }
.underpage { margin: 16px 0 4px; padding: 14px 0 4px; border-top: 1px dashed rgba(160,140,110,0.3); }
.underpage-label { color: var(--amber-faint); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.undertext { color: #d9c7a4; font-style: italic; line-height: 1.7; text-shadow: 0 0 6px rgba(180,150,90,0.18); }
.undertext .u-shown { color: #ecdcb4; }      /* excavated, legible — and drift never touches it */
.undertext .u-hidden { color: #6a5c40; opacity: 0.5; }  /* still buried; wear the page more */
.underpage.scraped .underpage-label { color: #7a6a50; font-style: italic; text-transform: none; letter-spacing: 0.04em; }

/* the Restoration — recovered pages in the journal, and the tallies on screens */
.recovered-head { color: #ecdcb4; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; margin: 26px 0 12px; padding-top: 16px; border-top: 1px dashed rgba(160,140,110,0.3); }
.entry.recovered-entry { border-left-color: #b89a5e; }
.recovered-text { color: #ecdcb4; font-style: italic; }
#screen .meta-line.restored { color: #b89a5e; }

.ghost { color: var(--amber-dim); font-style: italic; opacity: 0.62; font-size: 14px; margin: 18px 0 6px; }
.ghost::before { content: "— "; }
.ghost.falsestair { color: #c98f6a; opacity: 0.85; }

/* Sanctuary: arriving at an oasis clears the drift and brightens the room — an
   unmistakable landmark and a place to rest. */
.sanctuary-head { color: var(--amber); letter-spacing: 0.24em; text-transform: uppercase; font-size: 12.5px; text-align: center; margin: 4px 0 22px; text-shadow: 0 0 18px rgba(255,176,0,0.4); opacity: 0.9; }
.passage.sanctuary { color: #fff4dd; text-shadow: 0 0 2px rgba(255,200,90,0.18); }
body.in-sanctuary { --drift: 0; }
body.in-sanctuary::before { background:
  radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,0.42) 100%); }

/* The stair down — offered by any descent room, true or false. */
.descend-control { margin: 22px 0 8px; text-align: center; }
.descend {
  background: linear-gradient(180deg, rgba(255,176,0,0.16), rgba(255,176,0,0.04));
  border: 1px solid var(--amber-dim); color: var(--amber); font: inherit; font-size: 15px;
  letter-spacing: 0.18em; text-transform: uppercase; padding: 13px 34px; cursor: pointer;
  border-radius: 3px; transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
  box-shadow: 0 0 22px rgba(255,176,0,0.1);
}
.descend:hover { background: linear-gradient(180deg, rgba(255,176,0,0.28), rgba(255,176,0,0.08)); box-shadow: 0 0 30px rgba(255,176,0,0.22); }
.descend:active { transform: translateY(2px); }
.rb-inner.descend-banner { color: #ffe1a0; border-color: rgba(255,176,0,0.7); font-size: clamp(13px, 2.4vw, 18px); }

/* ---- exits ---- */
#exits { padding: 8px 0 22px; }
.exits-label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber-faint); margin: 14px 0 10px; }
.exit {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: linear-gradient(90deg, rgba(255,176,0,0.04), transparent);
  border: 1px solid rgba(185,127,6,0.28); border-left: 2px solid var(--amber-dim);
  color: var(--amber); font: inherit; font-size: 15px; line-height: 1.5;
  padding: 11px 14px; margin: 0 0 9px; border-radius: 2px;
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
.exit:hover, .exit.sel { background: linear-gradient(90deg, rgba(255,176,0,0.13), transparent); border-left-color: var(--amber); }
.exit:active { transform: translateX(2px); }
.exit .num { color: var(--amber-dim); margin-right: 12px; }
.exit .preview { color: var(--paper); opacity: 0.85; }
.exit .tags { float: right; font-size: 11.5px; color: var(--amber-faint); letter-spacing: 0.08em; }
.exit .warmth { display: inline-block; margin-left: 10px; letter-spacing: 1px; }
.exit .beacon { display: inline-block; margin-left: 9px; color: #ffd066; text-shadow: 0 0 8px rgba(255,200,80,0.7); }
.exit .trailmark { display: inline-block; margin-left: 9px; color: var(--amber-dim); }
.exit .disturbed { display: inline-block; margin-left: 9px; color: #9fb0c0; opacity: 0.7; }
.ghost.presence { color: #aebccb; opacity: 0.7; font-style: italic; }
.ghost.presence::before { content: "— "; }
.exit.back { border-left-color: var(--amber-faint); opacity: 0.85; }
.exit.visited .preview::after { content: " ·"; }

/* ---- footer / controls ---- */
#footer { display: flex; gap: 18px; align-items: center; padding: 12px 2px 18px; border-top: 1px solid rgba(107,77,8,0.25); font-size: 12.5px; color: var(--amber-faint); }
#footer button { background: none; border: none; color: var(--amber-faint); cursor: pointer; font: inherit; letter-spacing: 0.08em; text-transform: uppercase; }
#footer button:hover { color: var(--amber); }
#footer .spacer { flex: 1; }

/* ---- journal overlay ---- */
#journal { position: fixed; inset: 0; z-index: 60; background: #060504; display: none; flex-direction: column; padding: 5vh 8vw; }
#journal.open { display: flex; }
#journal h2 { color: var(--amber-dim); font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: normal; }
#journal .entries { flex: 1; overflow-y: auto; margin: 12px 0; }
#journal .entry { border-left: 2px solid var(--amber-faint); padding: 4px 0 4px 14px; margin: 0 0 14px; color: var(--paper); font-size: 14.5px; }
#journal .entry .meta { color: var(--amber-faint); font-size: 11.5px; letter-spacing: 0.1em; }
#journal textarea { background: #060504; color: var(--paper); border: 1px solid var(--amber-faint); font: inherit; font-size: 14px; padding: 10px; width: 100%; height: 70px; resize: none; }
#journal .jbtns { margin-top: 10px; display: flex; gap: 14px; }
#journal button { background: none; border: 1px solid var(--amber-faint); color: var(--amber); font: inherit; padding: 6px 16px; cursor: pointer; letter-spacing: 0.08em; }
#journal button:hover { border-color: var(--amber); }

/* ---- the key / legend overlay ---- */
#legend { position: fixed; inset: 0; z-index: 60; background: #060504; display: none; flex-direction: column; padding: 6vh 8vw; overflow-y: auto; }
#legend.open { display: flex; }
#legend h2 { color: var(--amber-dim); font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: normal; margin: 0 0 18px; }
#legend .legend-rows { margin-bottom: 8px; }
#legend .legend-row { display: flex; gap: 16px; align-items: baseline; margin: 0 0 16px; }
#legend .legend-glyph { flex: 0 0 28px; text-align: center; font-size: 18px; color: var(--amber); }
#legend .legend-glyph.beacon { color: #ffd066; text-shadow: 0 0 8px rgba(255,200,80,0.7); }
#legend .legend-glyph.trailmark { color: var(--amber-dim); }
#legend .legend-glyph.disturbed { color: #9fb0c0; }
#legend .legend-name { color: var(--paper); font-size: 15px; }
#legend .legend-desc { color: var(--amber-faint); font-size: 13.5px; line-height: 1.5; max-width: 60ch; }
#legend .legend-note { color: var(--amber-dim); font-size: 13.5px; line-height: 1.6; max-width: 64ch; margin: 14px 0 0; }
#legend .legend-note.dim { color: var(--amber-faint); font-style: italic; }
#legend .jbtns { margin-top: 22px; }
#legend button { background: none; border: 1px solid var(--amber-faint); color: var(--amber); font: inherit; padding: 6px 16px; cursor: pointer; letter-spacing: 0.08em; }
#legend button:hover { border-color: var(--amber); }

/* ---- title / intro screen ---- */
#screen { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 8vw; }
#screen.hidden { display: none; }
#screen h1 { font-size: clamp(34px, 9vw, 76px); letter-spacing: 0.36em; margin: 0 0 4px; color: var(--amber); text-shadow: 0 0 26px rgba(255,176,0,0.35); animation: breathe 6s ease-in-out infinite; }
#screen .sub { color: var(--amber-faint); letter-spacing: 0.32em; font-size: 12px; text-transform: uppercase; margin-bottom: 40px; }
#screen .intro { color: var(--paper); max-width: 540px; line-height: 1.8; opacity: 0.92; font-size: 15.5px; white-space: pre-wrap; }
#screen .enter { margin-top: 44px; color: var(--amber); border: 1px solid var(--amber-dim); background: none; font: inherit; letter-spacing: 0.22em; text-transform: uppercase; padding: 14px 40px; cursor: pointer; animation: breathe 4s ease-in-out infinite; }
#screen .enter:hover { background: rgba(255,176,0,0.1); }
#screen .depth-read { margin-top: 30px; color: var(--amber-dim); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; }
#screen .meta-line { margin-top: 26px; color: var(--amber-faint); font-size: 12px; letter-spacing: 0.1em; }
@keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
#screen .forget {
  margin-top: 22px; background: none; border: none; cursor: pointer;
  color: var(--amber-faint); font: inherit; font-size: 11.5px;
  letter-spacing: 0.16em; text-transform: uppercase; text-decoration: underline;
  text-underline-offset: 4px; opacity: 0.7;
}
#screen .forget:hover { color: var(--amber-dim); opacity: 1; }

/* the end screen, after the exit */
#screen.ending h1 { font-size: clamp(22px,5vw,40px); letter-spacing: 0.18em; }

/* region-crossing banner — a momentary title-card, centered, that announces a
   new voice and then dissolves. Opaque pill so it reads cleanly even when it
   floats over the (amber) exit choices. It's *place*, never a compass: which
   book you've wandered into, nothing about the way out. */
#region-banner {
  position: fixed; top: 33%; left: 0; right: 0; z-index: 55;
  display: flex; justify-content: center; pointer-events: none;
}
#region-banner .rb-inner {
  opacity: 0;
  background: rgba(7, 5, 3, 0.94);
  border: 1px solid rgba(185, 127, 6, 0.55);
  border-radius: 4px;
  padding: 12px 30px 12px 36px;
  color: var(--amber); letter-spacing: 0.4em; text-transform: uppercase;
  font-size: clamp(14px, 2.6vw, 19px);
  text-shadow: 0 0 18px rgba(255, 176, 0, 0.45);
  box-shadow: 0 8px 44px rgba(0, 0, 0, 0.8), 0 0 26px rgba(255, 176, 0, 0.12);
}
#region-banner.show .rb-inner { animation: region 2.6s ease forwards; }
@keyframes region {
  0% { opacity: 0; transform: translateY(9px); }
  16% { opacity: 1; transform: none; }
  66% { opacity: 1; }
  100% { opacity: 0; }
}

/* Accessibility: honour reduced-motion. The passage is always legible anyway;
   this calms the chrome's animation for readers the motion would hurt. The
   semantic degradation (drifting words, beacons fading) remains — only the
   restless motion is stilled. (docs/NEXT_MOVEMENTS.md §7) */
@media (prefers-reduced-motion: reduce) {
  .passage { animation: none; }
  #region-banner.show .rb-inner { animation: regionStill 2.6s linear forwards; }
  #screen h1, #screen .enter { animation: none; }
  @keyframes regionStill { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
}

.hidden { display: none !important; }

</style>

/* ==== js/core.js ==== */
/* PALIMPSEST runtime — shared core.
 *
 * Classic script (no ES modules) so the game runs straight off the filesystem.
 * Everything hangs off the single global `P`. The graph arrives as window.GRAPH.
 */
window.P = window.P || {};

P.core = (function () {
  // mulberry32 — same generator the build pipeline uses, so "deterministic"
  // means the same thing on both sides.
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  const rng = (seed) => mulberry32(typeof seed === 'string' ? hash(seed) : seed >>> 0);
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const pick = (rand, arr) => arr[Math.floor(rand() * arr.length)];
  const el = (id) => document.getElementById(id);

  function h(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) node.setAttribute(k, attrs[k]);
    }
    if (children != null) (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  return { mulberry32, hash, rng, clamp, pick, el, h };
})();


/* ==== js/persist.js ==== */
/* Meta-persistence.
 *
 * The roguelike conceit (per the design): the *character* doesn't progress, the
 * *player* does. We persist two things:
 *   1. META — cumulative knowledge across all runs: how much you've read, how
 *      many runs, whether you've ever found the exit. This is what "trains your
 *      ear" and eventually unlocks the (unreliable) compass.
 *   2. RUN — your position in the current world so closing the tab doesn't strand
 *      you. Finding the exit ends a run; a new run resets position but never the
 *      META. The library is the same world (one build = one world); only you
 *      change.
 */
P.persist = (function () {
  const META_KEY = 'palimpsest.meta.v1';
  const runKey = (seed) => `palimpsest.run.${seed}.v1`;

  const defaultsMeta = () => ({
    nodesRead: 0,     // cumulative distinct-ish reads across runs
    steps: 0,         // cumulative moves
    runs: 0,
    everFound: false,
    recovered: {},    // the Restoration: pages of the older book, idx -> text.
                      // Persist across runs AND rebuilds — the buried book is the
                      // same book in every world; what you have recovered, you keep.
    firstSeen: Date.now(),
  });

  function load(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v && typeof v === 'object' ? v : fallback(); }
    catch (e) { return fallback(); }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  let meta = load(META_KEY, defaultsMeta);

  function newRun(seed) {
    return { seed, pos: null, visited: {}, journal: [], steps: 0, started: Date.now(), found: false };
  }

  return {
    meta() { return meta; },
    saveMeta() { save(META_KEY, meta); },

    // The Restoration: record a fully-excavated page of the older book.
    recoverPage(idx, text) {
      if (idx == null || idx < 0) return false;
      if (!meta.recovered) meta.recovered = {};
      if (meta.recovered[idx]) return false;
      meta.recovered[idx] = text;
      save(META_KEY, meta);
      return true; // newly recovered
    },
    recoveredPages() {
      const rec = meta.recovered || {};
      return Object.keys(rec).map(Number).sort((a, b) => a - b).map((i) => ({ idx: i, text: rec[i] }));
    },

    loadRun(seed) {
      const r = load(runKey(seed), () => newRun(seed));
      r.seed = seed;
      if (!r.visited) r.visited = {};
      if (!r.journal) r.journal = [];
      return r;
    },
    saveRun(run) { save(runKey(run.seed), run); },
    resetRun(seed) { const r = newRun(seed); save(runKey(seed), r); return r; },

    // Forget everything: position, journal, AND cumulative knowledge. The
    // compass re-locks; you arrive new. Clears every palimpsest.* key so it
    // works no matter which world's seed you've played.
    wipe() {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k.startsWith('palimpsest.')) localStorage.removeItem(k);
        }
      } catch (e) {}
      meta = defaultsMeta();
    },

    // "The ear": a 0..1 sense of how attuned the player is, from cumulative
    // reading. Drives the compass unlock. Deliberately slow — attunement is earned.
    ear() {
      const n = meta.nodesRead;
      return Math.max(0, Math.min(1, Math.log10(1 + n / 12) / Math.log10(1 + 220 / 12)));
    },
    compassUnlocked() { return meta.nodesRead >= 160 || meta.everFound; },
  };
})();


/* ==== js/degrade.js ==== */
/* UI degradation — the unreliable HUD.
 *
 * Per the design's hard constraint: this is a PRESENTATION effect only. It
 * drifts the chrome — status line, exit tags, your own journal notes, the
 * compass — based on local coherence. It NEVER touches the passage you read
 * (that's the honest data the whole game is about) and it NEVER alters game
 * state. Close the tab and reopen: your notes are pristine again. Only the
 * screen was lying.
 *
 * It is tuned to stay readable. The design: "subtle and escalating, never so
 * aggressive that it breaks usability." Amount caps well below garbage.
 */
P.degrade = (function () {
  const { rng, clamp } = P.core;

  const ACCENT = { a:'àáâä', e:'èéêë', i:'ìíîï', o:'òóôö', u:'ùúûü', n:'ñ', c:'ç', s:' š', y:'ý',
                   A:'ÀÁÂÄ', E:'ÈÉÊË', I:'ÌÍÎÏ', O:'ÒÓÔÖ', U:'ÙÚÛÜ', N:'Ñ' };
  const COMBINING = ['̀','́','̂','̃','̈','̣','̱'];

  // Subtle character-level drift for short HUD labels.
  function label(str, amount, seed) {
    if (amount <= 0.02) return str;
    const rand = rng((seed || str) + '|' + Math.round(amount * 20));
    const a = clamp(amount);
    let out = '';
    for (const ch of str) {
      const r = rand();
      if (/[a-zA-Z]/.test(ch) && ACCENT[ch] && r < a * 0.22) {
        const opts = ACCENT[ch].trim();
        out += opts[Math.floor(rand() * opts.length)] || ch;
      } else out += ch;
      if (a > 0.55 && rand() < (a - 0.55) * 0.5) out += COMBINING[Math.floor(rand() * COMBINING.length)];
    }
    return out;
  }

  // Word-level drift for the player's own journal notes — the trust mechanic.
  // Words decay toward other words you wrote (and a little ambient seepage), so
  // your record of where you've been quietly stops being true.
  const AMBIENT = ['elsewhere','again','the same','not here','further','nothing','a door','turn back',
                   'i think','perhaps','it lied','deeper','the light','no exit','warmer','colder'];
  function note(str, amount, seed, corpus) {
    if (amount <= 0.05) return str;
    const a = clamp(amount);
    const rand = rng((seed || '') + '|note|' + Math.round(a * 12));
    const pool = (corpus && corpus.length ? corpus : []).concat(AMBIENT);
    const words = str.split(/(\s+)/);
    return words.map((w) => {
      if (/^\s+$/.test(w) || w.length < 3) return w;
      const r = rand();
      if (r < a * 0.30) {
        const sub = pool[Math.floor(rand() * pool.length)];
        return preserveCase(w, sub);
      }
      if (r < a * 0.30 + a * 0.06) return ''; // a word goes missing
      return w;
    }).join('').replace(/\s{2,}/g, ' ');
  }

  function preserveCase(orig, repl) {
    if (/^[A-Z]/.test(orig)) return repl.charAt(0).toUpperCase() + repl.slice(1);
    return repl;
  }

  // Compass warmth as a glyph bar. value is destination coherence (0..1). drift
  // injects lies: in incoherent zones the reading is scrambled, so the compass
  // betrays you exactly where you'd most want to trust it.
  const GLYPHS = '·∴∷▒▓█';
  function warmth(value, drift, seed) {
    const rand = rng((seed || '') + '|warmth');
    const noise = (rand() - 0.5) * 2 * clamp(drift) * 0.9;
    const v = clamp(value + noise);
    const n = Math.round(v * 5);
    return GLYPHS[n] + GLYPHS[n]; // doubled for visual weight
  }

  return { label, note, warmth };
})();


/* ==== js/ghosts.js ==== */
/* Other travelers.
 *
 * Traces of those who came before — a margin scrawl, an underlined word, a
 * scratched plea. Deterministic per node (seeded by node id), so the same hall
 * always bears the same mark: it feels persistent, like real history. Whether
 * they were ever real, whether they got out, whether they were ever even people
 * — the game never says. (Async-real traces could be layered on later; the
 * design leaves it open. These are honest fabrications, which is itself the
 * point.)
 *
 * Ghosts thin out near coherence (the found places need no annotation) and
 * crowd the incoherent deep (where people got desperate).
 */
P.ghosts = (function () {
  const { rng, pick } = P.core;

  const MARGIN = [
    'someone underlined this, hard enough to tear the page',
    'a hand wrote in the margin: i have been here before',
    'a hand wrote in the margin: don’t trust the warm ones',
    'scratched into the shelf: 412 days. or pages. i can’t tell anymore',
    'a margin note, half rubbed away: it reads beautifully and it means nothing',
    'someone circled a single word and wrote below it: this one. this one is real',
    'pressed into the dust: a handprint, smaller than yours',
    'a note folded into the spine: if you are reading this you are not the first',
    'written and then crossed out: i think i am close — i think i am close — i',
    'a child’s letters: THE DOOR IS THE READING. then nothing',
    'someone has torn out the next page. only the stub remains',
    'in the gutter of the page: keep going. the warmth lies but the cold lies too',
    'a different ink, older: i stopped being sure which of us was writing',
    'underlined twice: meaning is a feeling you get when the pattern is dense enough',
    'a single tally mark, fresh, beside a thousand faded ones',
  ];

  // Returns a ghost annotation string for this node, or null.
  function forNode(node) {
    const rand = rng(node.id + '|ghost');
    // More likely in the incoherent deep, rare in oases.
    const p = 0.10 + (1 - node.coherence) * 0.32 + (node.kind === 'mimic' ? 0.18 : 0);
    if (rand() > p) return null;
    return pick(rand, MARGIN);
  }

  return { forNode };
})();


/* ==== js/audio.js ==== */
/* Procedural sound — no asset files, all synthesized via Web Audio.
 *
 * Two layers shape the ambience:
 *   1. COHERENCE (how lost you are) — as rooms get incoherent the drone detunes,
 *      the noise bed opens, and a formant "almost-voice" emerges that never quite
 *      forms a word. The exit is true silence, then the text.
 *   2. ZONE (which book you're in) — each voice has its own sonic signature: a
 *      root pitch, a noise colour, a vowel-like formant timbre, an LFO cadence.
 *      The whale is vast and slow; the undying is low and dreadful; the
 *      looking-glass is skittish and bright. Crossing voices crossfades between
 *      them, so the place has a sound, not just a temperature.
 *
 * Everything is generated — no licensing, no downloads. Audio only starts after
 * a user gesture (browser policy) and is off by default. */
P.audio = (function () {
  let ctx = null, master = null, started = false, enabled = false;
  let noiseSrc, noiseFilter, noiseGain;
  let droneOsc, droneGain;
  let formantA, formantB, formantGain, fFilter, lfo, lfoGain;
  let curCoh = 1, palette = null;

  // Per-voice palettes. Tuned by mood, not realism:
  //   root      drone fundamental (Hz)         noiseHz/Q  air colour
  //   toneHz    formant oscillator base        beat       detune ratio (its "grain")
  //   formantHz vowel centre of the almost-voice          formantQ sharpness
  //   lfoHz     wobble cadence                 *Gain      relative loudness
  const DEFAULT = { root: 55, noiseHz: 420, noiseQ: 0.6, toneHz: 320, beat: 1.02,
                    formantHz: 700, formantQ: 6, lfoHz: 0.7, wave: 'sawtooth',
                    droneGain: 0.05, voiceGain: 0.06, noiseGain: 0.06 };
  const PALETTES = {
    // light, airy, gentle — a bright drawing room
    austen:   { root: 82, noiseHz: 640, noiseQ: 0.5, toneHz: 392, beat: 1.005, formantHz: 980, formantQ: 4, lfoHz: 0.5, wave: 'triangle', droneGain: 0.034, voiceGain: 0.038, noiseGain: 0.05 },
    // heavy, ominous, crowded
    dickens:  { root: 49, noiseHz: 360, noiseQ: 0.7, toneHz: 233, beat: 1.03, formantHz: 560, formantQ: 7, lfoHz: 0.8, wave: 'sawtooth', droneGain: 0.06, voiceGain: 0.062, noiseGain: 0.06 },
    // organic, slow, patient
    darwin:   { root: 58, noiseHz: 480, noiseQ: 0.6, toneHz: 300, beat: 1.015, formantHz: 700, formantQ: 5, lfoHz: 0.34, wave: 'sine', droneGain: 0.045, voiceGain: 0.045, noiseGain: 0.055 },
    // tense, dissonant, a heartbeat under the floor
    poe:      { root: 52, noiseHz: 340, noiseQ: 0.8, toneHz: 277, beat: 1.06, formantHz: 520, formantQ: 9, lfoHz: 1.1, wave: 'sawtooth', droneGain: 0.06, voiceGain: 0.072, noiseGain: 0.06 },
    // uncanny, skittish, bright — wrong in a playful way
    carroll:  { root: 65, noiseHz: 720, noiseQ: 0.5, toneHz: 415, beat: 1.04, formantHz: 1080, formantQ: 6, lfoHz: 1.7, wave: 'square', droneGain: 0.04, voiceGain: 0.05, noiseGain: 0.05 },
    // electrical, cold, a buzz in the wiring
    shelley:  { root: 50, noiseHz: 520, noiseQ: 0.7, toneHz: 350, beat: 1.08, formantHz: 820, formantQ: 8, lfoHz: 0.9, wave: 'sawtooth', droneGain: 0.052, voiceGain: 0.06, noiseGain: 0.06 },
    // vast, deep, oceanic swells
    melville: { root: 41, noiseHz: 300, noiseQ: 0.6, toneHz: 196, beat: 1.01, formantHz: 470, formantQ: 5, lfoHz: 0.22, wave: 'sine', droneGain: 0.07, voiceGain: 0.05, noiseGain: 0.072 },
    // austere, sparse, almost silent — a quiet mind
    aurelius: { root: 55, noiseHz: 440, noiseQ: 0.5, toneHz: 330, beat: 1.003, formantHz: 660, formantQ: 3, lfoHz: 0.3, wave: 'sine', droneGain: 0.03, voiceGain: 0.03, noiseGain: 0.04 },
    // dread, low, the voice nearly present even when coherent (your Silent Hill)
    stoker:   { root: 46, noiseHz: 320, noiseQ: 0.85, toneHz: 220, beat: 1.05, formantHz: 500, formantQ: 9, lfoHz: 0.6, wave: 'sawtooth', droneGain: 0.066, voiceGain: 0.085, noiseGain: 0.07 },
    // cold, distant, thin air of a far time
    wells:    { root: 62, noiseHz: 780, noiseQ: 0.45, toneHz: 466, beat: 1.02, formantHz: 1240, formantQ: 5, lfoHz: 0.45, wave: 'triangle', droneGain: 0.035, voiceGain: 0.046, noiseGain: 0.05 },
  };
  palette = DEFAULT;

  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);

    // Air: filtered noise bed (the room tone).
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    noiseSrc = ctx.createBufferSource(); noiseSrc.buffer = noiseBuf; noiseSrc.loop = true;
    noiseFilter = ctx.createBiquadFilter(); noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = palette.noiseHz; noiseFilter.Q.value = palette.noiseQ;
    noiseGain = ctx.createGain(); noiseGain.gain.value = palette.noiseGain;
    noiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);

    // Drone floor.
    droneOsc = ctx.createOscillator(); droneOsc.type = 'sine'; droneOsc.frequency.value = palette.root;
    droneGain = ctx.createGain(); droneGain.gain.value = palette.droneGain;
    droneOsc.connect(droneGain); droneGain.connect(master);

    // The almost-voice: two detuned oscillators through a wandering bandpass.
    formantA = ctx.createOscillator(); formantA.type = palette.wave; formantA.frequency.value = palette.toneHz;
    formantB = ctx.createOscillator(); formantB.type = palette.wave; formantB.frequency.value = palette.toneHz * palette.beat;
    formantGain = ctx.createGain(); formantGain.gain.value = 0.0;
    fFilter = ctx.createBiquadFilter(); fFilter.type = 'bandpass'; fFilter.frequency.value = palette.formantHz; fFilter.Q.value = palette.formantQ;
    formantA.connect(fFilter); formantB.connect(fFilter); fFilter.connect(formantGain); formantGain.connect(master);

    lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = palette.lfoHz;
    lfoGain = ctx.createGain(); lfoGain.gain.value = 120;
    lfo.connect(lfoGain); lfoGain.connect(fFilter.frequency);

    [noiseSrc, droneOsc, formantA, formantB, lfo].forEach((o) => o.start());
    apply(0.4);
  }

  function setEnabled(on) {
    enabled = on;
    if (on) { ensure(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
    if (master) master.gain.setTargetAtTime(on ? 0.9 : 0.0, ctx ? ctx.currentTime : 0, 0.4);
  }

  // Select the voice of the current zone. Crossfades by retargeting every node.
  function setZone(themeKey) {
    const p = PALETTES[themeKey] || DEFAULT;
    const changed = p !== palette;
    palette = p;
    if (changed && formantA) { formantA.type = p.wave; formantB.type = p.wave; }
    apply();
  }

  // Move the soundscape toward (palette, coherence). 1 = calm, 0 = the drift.
  function setCoherence(coh) { curCoh = coh; apply(); }

  function apply(glide = 1.4) {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime, p = palette, drift = 1 - curCoh;
    noiseFilter.frequency.setTargetAtTime(p.noiseHz + drift * 260, t, glide);
    noiseFilter.Q.setTargetAtTime(p.noiseQ, t, glide);
    noiseGain.gain.setTargetAtTime(p.noiseGain + drift * 0.015, t, glide);
    droneOsc.frequency.setTargetAtTime(p.root * (1 - drift * 0.12), t, glide);
    droneGain.gain.setTargetAtTime(p.droneGain + drift * 0.04, t, glide);
    formantA.frequency.setTargetAtTime(p.toneHz, t, glide);
    formantB.frequency.setTargetAtTime(p.toneHz * p.beat, t, glide);
    fFilter.frequency.setTargetAtTime(p.formantHz, t, glide);
    fFilter.Q.setTargetAtTime(p.formantQ, t, glide);
    // The voice has a per-zone floor (its inherent dread) plus coherence drift.
    formantGain.gain.setTargetAtTime(p.voiceGain * (0.12 + drift * drift * 0.9), t, glide);
    lfo.frequency.setTargetAtTime(p.lfoHz + drift * 1.0, t, glide);
  }

  function pageTurn() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    const len = Math.floor(0.12 * ctx.sampleRate);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 0.5;
    src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800;
    const g = ctx.createGain(); g.gain.value = 0.18;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }

  // Crossing into a different voice. A soft threshold swell, rooted on the zone
  // you're entering so the chord belongs to its new home.
  function crossing() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 1.0);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    g.connect(f); f.connect(master);
    const base = (palette.root || 49) * 2;
    [base, base * 1.5, base * 2].forEach((freq, i) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq * 0.985, t);
      o.frequency.linearRampToValueAtTime(freq, t + 0.3);
      const og = ctx.createGain(); og.gain.value = i === 0 ? 1 : i === 1 ? 0.45 : 0.22;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.05);
    });
  }

  // Descending a stratum: a longer, lower swell that glides downward and settles
  // — the floor opening, the drop, the new ground.
  function descend() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 1.8);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(1200, t); f.frequency.exponentialRampToValueAtTime(220, t + 1.6);
    g.connect(f); f.connect(master);
    const root = (palette.root || 49);
    [root * 2, root * 3, root * 4].forEach((freq, i) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 1.5); // glide down an octave
      const og = ctx.createGain(); og.gain.value = i === 0 ? 1 : i === 1 ? 0.4 : 0.2;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.85);
    });
  }

  // Recovering a page of the older book: one clear, unwavering tone with a soft
  // octave above — the only pure sound in the library, because it marks the only
  // pure thing in it. Brief, quiet, certain.
  function recovered() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 2.2);
    g.connect(master);
    [[523.25, 1], [1046.5, 0.18]].forEach(([freq, amp]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.3);
    });
  }

  // The exit: fade everything to true silence.
  function silence() {
    if (!ctx) return;
    const t = ctx.currentTime;
    [noiseGain, droneGain, formantGain].forEach((g) => g && g.gain.setTargetAtTime(0, t, 0.8));
  }

  return { setEnabled, setCoherence, setZone, pageTurn, crossing, descend, recovered, silence, isEnabled: () => enabled, start: () => { if (enabled) ensure(); started = true; void started; } };
})();


/* ==== js/engine.js ==== */
/* Engine — world state and navigation.
 *
 * The runtime is a reader, not a generator (design: zero ML at runtime). It
 * loads the pre-baked graph and tracks where you are, where you've been, and a
 * smoothed sense of how lost you are. That smoothing matters: immediate text
 * clarity reflects the room you're in, but the HUD's *drift* lags and lingers —
 * so wading through a stretch of noise leaves a residue on your interface that
 * doesn't lift the instant you find one clear room. That residue is the
 * apophenia the design asks for.
 *
 * It also keeps the memory aids (the dissolving trail, the journal beacons), the
 * quiet metrics that choose your ending, and the seeds for the unseen presence.
 * See docs/NEXT_MOVEMENTS.md §3–5.
 */
P.engine = (function () {
  const { clamp, rng, pick } = P.core;

  // Wear: every noise page thins with revisits. At `reveal` the surface starts
  // wearing through; at `full` it is worn to whatever lies beneath — an older
  // page (recovered, kept forever) or nothing at all.
  const WEAR = { reveal: 3, full: 6 };

  const PRESENCE = [
    'this mark is fresh. it was not here when you passed before.',
    'someone has been through since you left — the dust is disturbed.',
    'a page has been turned down that you did not turn.',
    'your own hand, you think. but the letters are not quite the way you make them.',
    'something has read this room after you, and not long ago.',
    'the chair is warm. you have not been sitting.',
    'there are more tally marks than there were. you did not add them.',
  ];

  const state = {
    graph: null, run: null, node: null,
    ema: 1, streakLow: 0,
    onChange: null, ended: false,
    regionChanged: false, enteredRegion: null,
    justDescended: null, falseStair: false,
    lastMoveTime: 0,
  };

  const freshMetrics = () => ({ up: 0, down: 0, minCoh: 1, dwellSum: 0, dwellN: 0,
    followWarmth: 0, compassMoves: 0, retreats: 0, deepRooms: 0, descents: 0, falseStairs: 0 });

  function init(graph) {
    state.graph = graph;
    const run = P.persist.loadRun(graph.meta.seed);
    if (!run.pos || !graph.nodes[run.pos]) run.pos = graph.start;
    if (!run.trail) run.trail = [];
    if (!run.metrics) run.metrics = freshMetrics();
    state.run = run;
    state.node = graph.nodes[run.pos];
    state.ema = state.node.coherence;
    state.lastMoveTime = Date.now();
    P.persist.saveRun(run);
    return state.node;
  }

  function node(id) { return state.graph.nodes[id]; }
  function current() { return state.node; }
  function visitedCount(id) { return state.run.visited[id] || 0; }

  function move(toId) {
    if (state.ended) return;
    const target = node(toId);
    if (!target) return;
    const prev = state.node;
    const m = state.run.metrics;

    // --- behaviour metrics (the private mirror that picks your ending) -------
    const now = Date.now();
    const dwell = now - state.lastMoveTime;
    if (dwell > 400 && dwell < 180000) { m.dwellSum += dwell; m.dwellN++; }
    state.lastMoveTime = now;
    if (prev) {
      if (target.coherence > prev.coherence + 0.05) m.up++;
      else if (target.coherence < prev.coherence - 0.05) m.down++;
      // did you follow the warmth? (only counts once the compass exists)
      if (P.persist.compassUnlocked()) {
        m.compassMoves++;
        const warmest = Math.max(...prev.exits.map((e) => node(e.to).coherence));
        if (target.coherence >= warmest - 1e-6) m.followWarmth++;
      }
      if (toId === state.run.trail[0]) m.retreats++; // stepped back the way you came
    }
    m.minCoh = Math.min(m.minCoh, target.coherence);
    if (target.coherence < 0.2) m.deepRooms++;

    // --- descending a stratum: a clean break, a new small world -------------
    const descended = prev && (target.stratum ?? 0) > (prev.stratum ?? 0);
    state.justDescended = descended ? (target.stratum ?? 0) : null;

    // --- the dissolving trail (reset when you drop a floor) -----------------
    if (descended) state.run.trail = [];
    else if (prev) { state.run.trail.unshift(prev.id); state.run.trail = state.run.trail.slice(0, 8); }

    // crossing into a different source-voice is a sense of place worth marking
    const fromTheme = prev ? prev.theme : null;
    state.regionChanged = !descended && fromTheme !== null && fromTheme !== target.theme;
    state.enteredRegion = state.regionChanged ? target.themeLabel : null;

    state.node = target;
    state.run.pos = toId;
    state.run.visited[toId] = (state.run.visited[toId] || 0) + 1;
    state.run.steps++;
    if ((target.stratum ?? 0) > (state.run.deepest ?? 0)) state.run.deepest = target.stratum;

    const meta = P.persist.meta();
    meta.steps++;
    if (state.run.visited[toId] === 1) meta.nodesRead++;
    if ((target.stratum ?? 0) > (meta.deepestEver ?? 0)) meta.deepestEver = target.stratum;

    // The Restoration: the visit that wears a buried page fully through recovers
    // it — into the one record the drift can never touch.
    state.justRecovered = false;
    if (target.under && state.run.visited[toId] >= WEAR.full) {
      state.justRecovered = P.persist.recoverPage(target.underIdx, target.under);
    }

    // A sanctuary clears the residue: arriving at an oasis heals the drift, so
    // the HUD comes back to truth and you can rest and orient.
    if (target.sanctuary) { state.ema = 1; state.streakLow = 0; }
    else { state.ema = state.ema * 0.7 + target.coherence * 0.3; state.streakLow = target.coherence < 0.42 ? state.streakLow + 1 : 0; }

    if (target.kind === 'exit') reachExit();

    P.persist.saveRun(state.run);
    P.persist.saveMeta();
    if (state.onChange) state.onChange();
  }

  // Take the stair in the current room. A true stair carries you down to the
  // next sanctuary; a false one gives way into a dead end you must climb out of.
  // You only know which by having read the passage.
  function descend() {
    const n = state.node;
    if (!n || !n.descent || !n.down || state.ended) return;
    if (n.descent === 'down') { state.run.metrics.descents++; move(n.down); }
    else { state.run.metrics.falseStairs++; state.falseStair = true; move(n.down); }
  }

  // Depth — the felt progress of the Descent.
  function stratum() { return state.node ? (state.node.stratum ?? 0) : 0; }
  function totalStrata() { return (state.graph.meta && state.graph.meta.strata) || 1; }
  function strataRemaining() { return Math.max(0, totalStrata() - 1 - stratum()); }

  function reachExit() {
    state.ended = true;
    state.run.found = true;
    const meta = P.persist.meta();
    if (!meta.everFound) meta.everFound = true;
    meta.runs++;
  }

  function newRun() {
    state.run = P.persist.resetRun(state.graph.meta.seed);
    state.run.trail = [];
    state.run.metrics = freshMetrics();
    state.node = node(state.graph.start);
    state.ema = state.node.coherence;
    state.streakLow = 0;
    state.lastMoveTime = Date.now();
    state.ended = false;
    if (state.onChange) state.onChange();
  }

  function drift() {
    return clamp((1 - state.ema) * 0.85 + Math.min(state.streakLow, 8) / 8 * 0.28, 0, 0.82);
  }
  function localCoherence() { return state.node ? state.node.coherence : 1; }

  // --- memory aids (docs/NEXT_MOVEMENTS.md §3) ------------------------------
  // How many steps of trail you can still feel — shrinks as you get lost. Pure
  // retreat memory; never points forward, never toward the exit.
  function trailReach() { return clamp(Math.round(4 * (1 - drift())), 0, 4); }
  function trailIndex(id) { const i = state.run.trail.indexOf(id); return i; }
  function isJournalled(id) { return state.run.journal.some((e) => e.at === id); }
  // Beacons (journalled rooms, one hop away) decay on the note-drift curve.
  function beaconStrength() { return clamp(1 - drift() * 1.3); }

  // --- the unseen presence (docs/NEXT_MOVEMENTS.md §4) ---------------------
  // A fresh mark, only on return, more likely the deeper you are. Never a
  // navigational tell — it appears regardless of where a room leads.
  function presenceMark(n) {
    if (visitedCount(n.id) < 2) return null;
    const d = drift();
    const rand = rng(n.id + '|presence|' + visitedCount(n.id));
    if (rand() > 0.1 + d * 0.4) return null;
    return pick(rand, PRESENCE);
  }
  // A hall that reads as recently disturbed. Seeded by step count, so it shifts
  // as you move — never fixed, never reliable, never correlated with safety.
  function disturbedAhead(targetId) {
    const rand = rng(targetId + '|disturbed|' + state.run.steps);
    return rand() < drift() * 0.13;
  }

  // --- ending selection (docs/NEXT_MOVEMENTS.md §5) ------------------------
  // A private reflection, scored from how you travelled. Never surfaced as a
  // rubric — only as the one coda that fits best.
  function endingArchetype() {
    const m = state.run.metrics;
    const moves = m.up + m.down || 1;
    const downBias = m.down / moves;
    const followRate = m.compassMoves ? m.followWarmth / m.compassMoves : 0;
    const meanDwell = m.dwellN ? m.dwellSum / m.dwellN : 0;
    const retreatRate = state.run.steps ? m.retreats / state.run.steps : 0;
    const scores = {
      trusting: (m.compassMoves >= 4 ? followRate * 1.25 : 0),
      diver: (0.3 - Math.min(m.minCoh, 0.3)) / 0.3 * 0.7 + Math.min(m.deepRooms / 10, 1) * 0.6,
      doubter: Math.min(retreatRate / 0.25, 1),
      cartographer: Math.min(m.minCoh / 0.38, 1) * 0.8 + (1 - downBias) * 0.4,
      reader: Math.min(meanDwell / 12000, 1) * 1.05,
    };
    return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  }
  function endingCoda() {
    const codas = (state.graph.meta && state.graph.meta.codas) || {};
    const key = endingArchetype();
    return { key, text: codas[key] || '' };
  }

  // Journal
  function addNote(text) {
    const n = state.node;
    state.run.journal.push({ at: n.id, loc: n.themeLabel, coh: n.coherence, text, t: Date.now() });
    P.persist.saveRun(state.run);
  }
  function journal() { return state.run.journal; }
  function noteWords() {
    const ws = [];
    for (const e of state.run.journal) for (const w of e.text.split(/\s+/)) if (w.length > 3) ws.push(w);
    return ws;
  }

  return {
    init, current, node, move, newRun, drift, localCoherence, visitedCount,
    addNote, journal, noteWords,
    regionChanged: () => state.regionChanged,
    enteredRegion: () => state.enteredRegion,
    descend, stratum, totalStrata, strataRemaining,
    WEAR,
    justRecovered: () => state.justRecovered,
    justDescended: () => state.justDescended,
    clearDescended: () => { state.justDescended = null; },
    falseStairTaken: () => { const f = state.falseStair; state.falseStair = false; return f; },
    trailReach, trailIndex, isJournalled, beaconStrength,
    presenceMark, disturbedAhead, endingArchetype, endingCoda,
    state,
    set onChange(fn) { state.onChange = fn; },
    isEnded: () => state.ended,
    run: () => state.run,
  };
})();


/* ==== js/render.js ==== */
/* Rendering. Rebuilds the reading view from engine state every move.
 *
 * What's honest and what drifts (the whole ethical line of the design):
 *   · The PASSAGE you stand in — always pristine. It's the data you judge.
 *   · PREVIEWS down each hall — mildly hazed by drift. You can't fully trust a
 *     glimpse; you have to commit and read. This sharpens the mimic danger.
 *   · STATUS / TAGS / your NOTES / the COMPASS — drift freely. The instruments lie.
 */
P.render = (function () {
  const { el, h, clamp, rng, pick } = P.core;
  let selIndex = 0;

  // Most of the older book did not survive the overwriting. Worn pages with
  // nothing beneath wear through to one of these — the gamble that makes a
  // surviving page precious. Deterministic per room, like everything else.
  const SCRAPED = [
    'the page wears through to nothing. whatever was written beneath did not survive the overwriting.',
    'beneath the surface: only the scrape marks. the older words are gone from here.',
    'the page thins to blank vellum. something was scraped away too well.',
    'worn through. under it, the ghost of ink with no letters left in it.',
    'nothing beneath but the grain of the page and the marks of the knife.',
  ];

  // Render the buried older book, excavated in proportion to how worn the page is.
  function renderUnderText(n, wear, reader, justRecovered) {
    const { reveal, full } = P.engine.WEAR;
    const words = n.under.split(' ');
    const frac = clamp((wear - (reveal - 1)) / (full - (reveal - 1)));
    const shown = Math.max(1, Math.floor(frac * words.length));
    const block = h('div', { class: 'underpage' });
    block.appendChild(h('div', { class: 'underpage-label' },
      frac >= 1
        ? (justRecovered ? 'the page is worn through — an older page, recovered. it will keep.' : 'the page is worn through; older writing beneath:')
        : 'the page is wearing thin; older writing shows beneath:'));
    const text = h('div', { class: 'undertext' });
    words.forEach((w, i) => text.appendChild(h('span', { class: i < shown ? 'u-shown' : 'u-hidden' }, w + ' ')));
    block.appendChild(text);
    reader.appendChild(block);
  }

  // A page worn through to nothing — most of the older book is simply gone.
  function renderScrapedBlank(n, reader) {
    const line = pick(rng(n.id + '|scraped'), SCRAPED);
    const block = h('div', { class: 'underpage scraped' });
    block.appendChild(h('div', { class: 'underpage-label' }, line));
    reader.appendChild(block);
  }

  function setVars() {
    const root = document.documentElement.style;
    root.setProperty('--coh', P.engine.localCoherence().toFixed(3));
    root.setProperty('--drift', P.engine.drift().toFixed(3));
  }

  function render() {
    const n = P.engine.current();
    const drift = P.engine.drift();
    setVars();
    document.body.classList.toggle('in-sanctuary', !!n.sanctuary && n.kind !== 'exit');
    P.audio.setZone(n.theme);
    P.audio.setCoherence(P.engine.localCoherence());

    // A descent outranks a voice-crossing as the thing to announce.
    const descended = P.engine.justDescended();
    if (descended != null) {
      showDescentBanner(descended);
      if (P.audio.descend) P.audio.descend();
      P.engine.clearDescended();
    } else if (n.kind !== 'exit' && P.engine.regionChanged()) {
      showRegionBanner(P.engine.enteredRegion(), drift);
      P.audio.crossing();
    }

    renderStatus(n, drift);

    const reader = el('reader');
    reader.innerHTML = '';

    if (n.kind === 'exit') { renderExit(n, reader); return; }

    // A stair that just gave way under you.
    if (P.engine.falseStairTaken()) {
      reader.appendChild(h('div', { class: 'ghost falsestair' }, 'the stair gives way beneath the words. it was never a way down. climb back, and keep reading.'));
    }

    // The room. Sanctuaries get a quiet masthead — an unmistakable landmark.
    if (n.sanctuary) {
      reader.appendChild(h('div', { class: 'sanctuary-head' }, '✦  ' + n.themeLabel + '  ·  a sanctuary  ✦'));
    }
    // PALIMPSEST, literal: EVERY noise page wears with revisits. Most wear
    // through to nothing — the older book did not survive there. A third hide a
    // surviving page, excavated word by word, immune to the drift, and kept
    // forever once fully recovered. Wearing a page is a gamble.
    const wear = P.engine.visitedCount(n.id);
    const wearable = (n.kind === 'corridor' || n.kind === 'mimic') && !n.authored && !n.descent;
    const worn = wearable && wear >= P.engine.WEAR.reveal;
    reader.appendChild(h('div', { class: 'passage' + (n.sanctuary ? ' sanctuary' : '') + (worn ? ' worn' : '') }, n.text));

    if (worn) {
      if (n.under) {
        const recoveredNow = P.engine.justRecovered();
        renderUnderText(n, wear, reader, recoveredNow);
        if (recoveredNow && P.audio.recovered) P.audio.recovered();
      } else {
        renderScrapedBlank(n, reader);
      }
    }

    // A trace of someone who passed through.
    const ghost = P.ghosts.forNode(n);
    if (ghost) reader.appendChild(h('div', { class: 'ghost' }, P.degrade.label(ghost, drift * 0.5, n.id + 'g')));

    const presence = P.engine.presenceMark(n);
    if (presence) reader.appendChild(h('div', { class: 'ghost presence' }, P.degrade.label(presence, drift * 0.4, n.id + 'pr')));

    // The stair down, if this room offers one. It looks the same whether true or
    // false: only the passage tells you which, and only if you read it.
    if (n.descent) {
      reader.appendChild(h('div', { class: 'descend-control' }, [
        h('button', { class: 'descend', onclick: () => P.engine.descend() }, '↓  take the stair down'),
      ]));
    }

    renderExits(n, drift, reader);
    reader.scrollTop = 0;
  }

  // The descent event: a held, weighty announcement of the floor you've reached.
  function showDescentBanner(stratumIdx) {
    let banner = el('region-banner');
    if (!banner) { banner = h('div', { id: 'region-banner' }); document.body.appendChild(banner); }
    const depth = stratumIdx + 1, total = P.engine.totalStrata();
    banner.innerHTML = '';
    banner.appendChild(h('span', { class: 'rb-inner descend-banner' }, '↓  you descend  ·  stratum ' + roman(depth) + ' of ' + roman(total)));
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
  }
  function roman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = ''; for (const [v, s] of map) while (n >= v) { out += s; n -= v; } return out || 'I';
  }

  // A brief, centered announcement of the voice you've just entered. Drifts a
  // little when you're lost, like everything else — but stays legible, because
  // knowing *where* you are never tells you where the exit is. It's place, not
  // a compass.
  function showRegionBanner(label, drift) {
    let banner = el('region-banner');
    if (!banner) { banner = h('div', { id: 'region-banner' }); document.body.appendChild(banner); }
    banner.innerHTML = '';
    banner.appendChild(h('span', { class: 'rb-inner' }, '— ' + P.degrade.label(label || '', drift * 0.35, 'region') + ' —'));
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
  }

  function renderStatus(n, drift) {
    const loc = P.degrade.label(n.themeLabel, drift, n.id + 'loc');
    const depth = P.engine.stratum() + 1, total = P.engine.totalStrata();
    el('status').innerHTML = '';
    el('status').append(
      h('div', { class: 'loc' }, [
        h('span', { class: 'depth' }, 'stratum ' + roman(depth) + ' / ' + roman(total)),
        h('span', { class: 'locname' }, P.degrade.label(' · ' + loc, drift * 0.7, n.id + 'l2')),
      ]),
      h('div', { class: 'right' },
        P.degrade.label(P.engine.run().steps + ' pages turned', drift * 0.4, 'pg')),
    );
  }

  function renderExits(n, drift, reader) {
    const exits = n.exits.slice();
    const wrap = h('div', { id: 'exits' });
    wrap.appendChild(h('div', { class: 'exits-label' }, P.degrade.label('the ways on', drift * 0.6, 'ways')));

    const compass = P.persist.compassUnlocked();
    const reach = P.engine.trailReach();
    const beacon = P.engine.beaconStrength();
    exits.forEach((e, i) => {
      const t = P.engine.node(e.to);
      const visited = P.engine.visitedCount(e.to) > 0;
      const previewRaw = e.preview || (t.text.split(/\s+/).slice(0, 8).join(' '));
      const preview = P.degrade.label(previewRaw, clamp(drift * 0.6), e.to + 'pv');

      const tags = [];

      // Journal beacon: a room you marked, lit while the note still holds.
      if (P.engine.isJournalled(e.to) && beacon > 0.12) {
        tags.push(h('span', { class: 'beacon', title: 'you left a note here', style: 'opacity:' + beacon.toFixed(2) }, '✦'));
      }
      // The dissolving trail: the way back, fading with how lost you are.
      const ti = P.engine.trailIndex(e.to);
      if (ti >= 0 && ti < reach) {
        const op = (1 - ti / Math.max(1, reach)) * 0.75 + 0.25;
        tags.push(h('span', { class: 'trailmark', title: 'the way back', style: 'opacity:' + op.toFixed(2) }, '↩'));
      }
      // A hall that reads as recently disturbed (presence; unreliable by design).
      if (P.engine.disturbedAhead(e.to)) {
        tags.push(h('span', { class: 'disturbed', title: 'recently disturbed' }, '≀'));
      }
      if (compass) {
        tags.push(h('span', { class: 'warmth', title: 'a sense of the air ahead' },
          P.degrade.warmth(t.coherence, drift, e.to)));
      }

      const btn = h('button', { class: 'exit' + (visited ? ' visited' : '') + (i === selIndex ? ' sel' : ''),
        'data-i': i, onclick: () => choose(i) }, [
        h('span', { class: 'num' }, (i + 1) + ''),
        h('span', { class: 'preview' }, '“' + preview + '…”'),
        h('span', { class: 'tags' }, tags),
      ]);
      wrap.appendChild(btn);
    });
    selIndex = Math.min(selIndex, exits.length - 1);
    reader.appendChild(wrap);
  }

  function choose(i) {
    const n = P.engine.current();
    if (i < 0 || i >= n.exits.length) return;
    P.audio.pageTurn();
    selIndex = 0;
    P.engine.move(n.exits[i].to);
  }

  function moveSel(d) {
    const n = P.engine.current();
    if (!n.exits.length) return;
    selIndex = (selIndex + d + n.exits.length) % n.exits.length;
    document.querySelectorAll('.exit').forEach((b, i) => b.classList.toggle('sel', i === selIndex));
    const sel = document.querySelector('.exit.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
  function confirmSel() { choose(selIndex); }

  function renderExit(n, reader) {
    P.audio.silence();
    document.documentElement.style.setProperty('--drift', '0');
    document.documentElement.style.setProperty('--coh', '1');
    reader.appendChild(h('div', { class: 'passage authored' }, n.text));
    const meta = P.persist.meta();
    reader.appendChild(h('div', { class: 'ghost' },
      `you have read ${meta.nodesRead} rooms across ${Math.max(1, meta.runs)} ${meta.runs === 1 ? 'descent' : 'descents'}.`));
    reader.appendChild(h('div', { id: 'exits' }, [
      h('button', { class: 'exit back', onclick: () => P.app.endScreen() }, [
        h('span', { class: 'num' }, '↩'),
        h('span', { class: 'preview' }, 'turn around'),
      ]),
    ]));
    reader.scrollTop = 0;
  }

  return { render, choose, moveSel, confirmSel };
})();


/* ==== js/main.js ==== */
/* Boot, intro, input, journal, endings. The thin glue that runs the show. */
P.app = (function () {
  const { el, h } = P.core;

  const INTRO =
`You do not remember coming in.

Shelves in every direction. Books on every shelf, words in every book — and you have read enough of them by now to know that almost none of the words mean anything. They arrive from nowhere. They hold together for a line, then forget what they were about.

The library only goes down. On each floor, hidden among the rooms that mean nothing, is one passage that someone *meant* — and it is a stair. Find it by reading, and descend. The fakes will flatter you; the real one will not need to.

At the very bottom is the one page written for you. You will know it when you read it.`;

  function boot() {
    const graph = window.GRAPH;
    if (!graph) { document.body.innerHTML = '<p style="color:#ffb000;padding:40px">graph not found — run the build (npm run build).</p>'; return; }

    // ?reset (or ?forget) wipes the save before anything loads — a bookmarkable
    // clean slate that needs no console.
    if (/[?&](reset|forget)\b/.test(location.search)) {
      P.persist.wipe();
      history.replaceState(null, '', location.pathname);
    }

    P.engine.init(graph);
    P.engine.onChange = () => P.render.render();

    buildTitle(graph);
    wireInput();
    wireFooter();

    // Resume hint: if the player is mid-run, the title still shows; entering
    // drops them where they left off.
  }

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function buildTitle(graph) {
    const meta = P.persist.meta();
    const resuming = P.engine.run().steps > 0 && !P.engine.run().found;
    const total = (graph.meta && graph.meta.strata) || 1;
    const depthNow = (P.engine.run().deepest || 0) + 1;
    const screen = el('screen');
    screen.className = '';
    screen.innerHTML = '';
    screen.append(
      h('h1', null, 'PALIMPSEST'),
      h('div', { class: 'sub' }, 'a library of almost-meaning'),
      h('div', { class: 'intro' }, resuming
        ? `You are still inside, ${ordinal(depthNow)} of ${total} floors down.\n\nThe shelves are where you left them. So are you.`
        : INTRO),
      h('div', { class: 'depth-read' }, resuming
        ? `the true page lies ${Math.max(0, total - depthNow)} ${total - depthNow === 1 ? 'floor' : 'floors'} below you still`
        : `the true page lies ${total - 1} floors down`),
      h('button', { class: 'enter', onclick: enter }, resuming ? 'go back in' : 'go in'),
      meta.runs > 0 || meta.nodesRead > 50
        ? h('div', { class: 'meta-line' }, `${meta.nodesRead} rooms read · ${meta.runs} ${meta.runs === 1 ? 'descent' : 'descents'}${meta.everFound ? ' · you have found it before' : ''}`)
        : h('div', { class: 'meta-line' }, 'press · then read'),
    );
    // The Restoration, standing across runs: what you wore through, you keep.
    const recovered = P.persist.recoveredPages().length;
    if (recovered > 0) {
      const underTotal = (graph.meta && graph.meta.underTotal) || 24;
      screen.append(h('div', { class: 'meta-line restored' },
        `of the older book: ${recovered} of ${underTotal} pages recovered`));
    }
    // Reset, only offered once there's something to forget.
    if (meta.nodesRead > 0 || P.engine.run().steps > 0) {
      screen.append(h('button', { class: 'forget', onclick: forgetEverything }, 'forget everything'));
    }
  }

  function forgetEverything() {
    if (!confirm('Forget everything? This erases your position, your notes, the pages of the older book you recovered, and the reading you have done — the compass re-locks and you arrive new. This cannot be undone.')) return;
    P.persist.wipe();
    P.engine.newRun();
    buildTitle(window.GRAPH);
  }

  function enter() {
    el('screen').classList.add('hidden');
    if (P.audio.isEnabled()) P.audio.start();
    P.render.render();
  }

  function wireFooter() {
    el('btn-journal').onclick = openJournal;
    const sound = el('btn-sound');
    sound.textContent = P.audio.isEnabled() ? 'sound: on' : 'sound: off';
    sound.onclick = () => {
      P.audio.setEnabled(!P.audio.isEnabled());
      sound.textContent = P.audio.isEnabled() ? 'sound: on' : 'sound: off';
      if (P.audio.isEnabled()) { P.audio.start(); P.audio.setCoherence(P.engine.localCoherence()); }
    };
    // A "key" control, injected so it lives in both the multi-file and the
    // single-file builds without duplicating markup.
    if (!el('btn-key')) {
      const key = h('button', { id: 'btn-key', title: 'what the marks mean (?)', onclick: openKey }, 'key');
      sound.insertAdjacentElement('afterend', key);
    }
  }

  // ---- the key (what the HUD marks mean) ----
  // Opt-in on purpose: players who want to stay in the dark never open it; the
  // confused get a clear explanation. It explains the *chrome* (marks, drift),
  // never where the door is — reading is still the only compass.
  function buildLegend() {
    const { h } = P.core;
    const rows = [
      ['↓', '', 'a stair down', 'offered by any room that might be a way to the next floor — true or false. only the passage tells you which, and only if you read it. a true stair carries you deeper; a false one drops you into a dead end to climb back out of.'],
      ['↩', 'trailmark', 'the way you came', 'a fading trail of the rooms behind you. its reach shrinks the more lost you are — a few steps when your head is clear, nothing in the deep. it only ever points backward.'],
      ['✦', 'beacon', 'a room you marked', 'a beacon over a journalled room one step away. it dims as your notes drift, and goes dark once you can no longer trust them.'],
      ['≀', 'disturbed', 'recently disturbed', 'this hall reads as though something passed through it lately. maybe someone did. it promises nothing — good or bad.'],
      ['·', '', 'you have been here', 'a hall you have already walked at least once.'],
      ['▓', 'warmth', 'the air ahead', 'if it has come to you yet: a wordless sense of how coherent the next room feels. warmer is more ordered — and it is fooled by the most beautiful dead ends. trust your reading over it.'],
    ];
    const list = rows.map(([g, cls, name, desc]) => h('div', { class: 'legend-row' }, [
      h('span', { class: 'legend-glyph ' + cls }, g),
      h('div', null, [h('div', { class: 'legend-name' }, name), h('div', { class: 'legend-desc' }, desc)]),
    ]));
    const overlay = h('div', { id: 'legend' }, [
      h('h2', null, 'reading the marks'),
      h('p', { class: 'legend-note' },
        'The library only goes down. Each floor begins in a sanctuary — an oasis that clears the drift and lets you rest and orient. Somewhere on each floor is a true stair, hidden among rooms that mean nothing; find it by reading, and descend. The depth at the top (Stratum N / M) is your progress; the one true page is kept at the very bottom.'),
      h('div', { class: 'legend-rows' }, list),
      h('p', { class: 'legend-note' },
        'How the drift works: the longer you spend in rooms that mean nothing, the more lost you become — and your instruments stop telling the truth. Labels take strange accents, words go missing, your own notes rewrite themselves, and these marks fade. It lingers, and lifts only slowly when you find clearer rooms.'),
      h('p', { class: 'legend-note' },
        'One thing never drifts: the passage you are reading. The incoherence there is real — in the words themselves, never in the ink.'),
      h('p', { class: 'legend-note' },
        'Every page in the halls wears thin if you walk it enough. Most wear through to nothing — the older book did not survive there. But under some, older writing shows, a little more each visit; wear one fully through and the page is recovered into your journal, where it keeps forever and never drifts. Wearing a page is a gamble. The survivors are worth it.'),
      h('p', { class: 'legend-note dim' },
        'None of these marks know where the door is. Only reading does.'),
      h('div', { class: 'jbtns' }, h('button', { onclick: closeKey }, 'close')),
    ]);
    document.body.appendChild(overlay);
    return overlay;
  }
  function openKey() { (el('legend') || buildLegend()).classList.add('open'); }
  function closeKey() { const l = el('legend'); if (l) l.classList.remove('open'); }

  // ---- journal ----
  function openJournal() {
    const j = el('journal');
    const drift = P.engine.drift();
    const entries = el('journal-entries');
    entries.innerHTML = '';
    const corpus = P.engine.noteWords();
    const list = P.engine.journal();
    if (!list.length) entries.appendChild(h('div', { class: 'entry' }, h('span', { class: 'meta' }, 'nothing written yet. mark a room while you can still trust the ink.')));
    list.forEach((e) => {
      // your own words drift — the deeper you are now, the less your past notes hold
      const text = P.degrade.note(e.text, drift, e.at, corpus);
      entries.appendChild(h('div', { class: 'entry' }, [
        h('div', { class: 'meta' }, P.degrade.label(e.loc, drift * 0.6, e.at) + ' · ' + new Date(e.t).toLocaleTimeString()),
        h('div', null, text),
      ]));
    });

    // The Restoration. Your own notes rot with the drift; the pages you wore
    // through and recovered do not — they are the one record in your keeping the
    // library cannot touch. The page numbers show the gaps: most of the book is
    // still down there, or gone for good.
    const pages = P.persist.recoveredPages();
    if (pages.length) {
      const total = (window.GRAPH && window.GRAPH.meta && window.GRAPH.meta.underTotal) || 24;
      entries.appendChild(h('div', { class: 'recovered-head' },
        `the recovered pages · ${pages.length} of ${total} · these do not drift`));
      pages.forEach((p) => {
        entries.appendChild(h('div', { class: 'entry recovered-entry' }, [
          h('div', { class: 'meta' }, 'page ' + (p.idx + 1)),
          h('div', { class: 'recovered-text' }, p.text),
        ]));
      });
    }

    j.classList.add('open');
    el('journal-text').focus();
  }
  function closeJournal() { el('journal').classList.remove('open'); }
  function saveNote() {
    const ta = el('journal-text');
    const v = ta.value.trim();
    if (v) { P.engine.addNote(v); ta.value = ''; }
    openJournal();
  }

  // ---- endings ----
  function endScreen() {
    const meta = P.persist.meta();
    const screen = el('screen');
    screen.className = 'ending';
    screen.innerHTML = '';
    // The coda is chosen by how you read your way here — a mirror, not a score.
    const coda = P.engine.endingCoda();
    const intro = coda.text
      || `You found the one page that was meant.\n\nWhether your certainty that it was real proves anything about you — whether recognition is understanding, or only what understanding feels like from the inside — the library does not say.`;
    screen.append(
      h('h1', null, 'you turned around'),
      h('div', { class: 'sub' }, 'the door was the reading'),
      h('div', { class: 'intro' }, intro),
      h('div', { class: 'meta-line' }, `${meta.nodesRead} rooms · ${meta.runs} ${meta.runs === 1 ? 'descent' : 'descents'} · one sentence that was waiting`),
      (() => {
        // What you carried out: the pages you wore through on the way down.
        const pages = P.persist.recoveredPages().length;
        const underTotal = (window.GRAPH && window.GRAPH.meta && window.GRAPH.meta.underTotal) || 24;
        return pages > 0
          ? h('div', { class: 'meta-line restored' }, `and you carried out ${pages} ${pages === 1 ? 'page' : 'pages'} of the older book — of ${underTotal} it once had. they are in your journal. they will keep.`)
          : h('div', { class: 'meta-line restored' }, 'you carried out none of the older book. it is still down there, under the pages you walked past only once.');
      })(),
      h('button', { class: 'enter', onclick: () => { P.engine.newRun(); buildTitle(window.GRAPH); el('screen').classList.remove('hidden'); } }, 'go in again'),
      h('div', { class: 'meta-line' }, 'the world reshuffles only when it is rebuilt. these shelves remain. you, perhaps, do not.'),
    );
    screen.classList.remove('hidden');
  }

  function wireInput() {
    document.addEventListener('keydown', (ev) => {
      const legend = el('legend');
      if (legend && legend.classList.contains('open')) {
        if (ev.key === 'Escape' || ev.key === '?') closeKey();
        return;
      }
      if (el('journal').classList.contains('open')) {
        if (ev.key === 'Escape') closeJournal();
        return;
      }
      if (ev.key === '?') { ev.preventDefault(); openKey(); return; }
      if (!el('screen').classList.contains('hidden')) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); const b = document.querySelector('#screen .enter'); if (b) b.click(); }
        return;
      }
      if (P.engine.isEnded()) return;
      if (/^[1-9]$/.test(ev.key)) { P.render.choose(parseInt(ev.key, 10) - 1); }
      else if (ev.key === 'ArrowDown' || ev.key === 'j') { ev.preventDefault(); P.render.moveSel(1); }
      else if (ev.key === 'ArrowUp' || ev.key === 'k') { ev.preventDefault(); P.render.moveSel(-1); }
      else if (ev.key === 'Enter') { ev.preventDefault(); P.render.confirmSel(); }
      else if (ev.key === 'J' || (ev.key === 'n' && ev.shiftKey)) openJournal();
    });
  }

  return { boot, endScreen, openJournal, closeJournal, saveNote, openKey, closeKey };
})();

document.addEventListener('DOMContentLoaded', P.app.boot);


</script>
</body>
</html>
